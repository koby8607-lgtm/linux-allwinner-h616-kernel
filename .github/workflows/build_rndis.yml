name: Build KNULLI Scarab RNDIS Kernel Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-aarch64-linux-gnu make bc bison flex libssl-dev libncurses-dev git libc6-dev

      - name: Fetch H700 Kernel Source (KNULLI/Batocera Base)
        run: |
          git clone --depth 1 -b orange-pi-4.9-sun50iw9 https://github.com/orangepi-xunlong/linux-orangepi.git kernel_source

      - name: Configure Kernel Tree & Build Host Tools
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Apply H700 base config
          CONFIG_PATH=$(find arch/ -name "*sun50i*" -o -name "*defconfig*" | head -n 1)
          cp "$CONFIG_PATH" .config

          # Prevent localversion vermagic appending
          echo "" > .scmversion
          scripts/config --file .config --set-str CONFIG_LOCALVERSION ""
          scripts/config --file .config --disable CONFIG_LOCALVERSION_AUTO

          # Explicitly enable module support infrastructure
          scripts/config --file .config --enable CONFIG_MODULES

          # Enforce ARM64 PLTs and disable MODVERSIONS CRC checking
          scripts/config --file .config --enable CONFIG_ARM64_MODULE_PLTS
          scripts/config --file .config --disable CONFIG_MODVERSIONS

          # Enable core MII and USB networking flags
          scripts/config --file .config --enable CONFIG_MII
          scripts/config --file .config --module CONFIG_USB_USBNET
          scripts/config --file .config --module CONFIG_USB_NET_CDCETHER
          scripts/config --file .config --module CONFIG_USB_NET_RNDIS_HOST

          make ARCH=arm64 olddefconfig

          # Prepare headers, asm links, and build genksyms/modpost scripts
          make ARCH=arm64 HOSTCFLAGS="-w" KCFLAGS="-w" prepare -j$(nproc)
          make ARCH=arm64 HOSTCFLAGS="-w" KCFLAGS="-w" scripts -j$(nproc)

      - name: Compile Network Drivers
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Build target directory using KCFLAGS="-w" to suppress GCC warnings
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCFLAGS="-w" \
            KCFLAGS="-w" \
            CONFIG_ARM64_MODULE_PLTS=y \
            CONFIG_MODVERSIONS=n \
            LOCALVERSION="" \
            M=drivers/net/usb modules -j$(nproc)

      - name: Collect & Package .ko Modules
        run: |
          mkdir output
          
          # Copy target USB network modules
          cp kernel_source/drivers/net/usb/usbnet.ko output/
          cp kernel_source/drivers/net/usb/cdc_ether.ko output/
          cp kernel_source/drivers/net/usb/rndis_host.ko output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knulli-scarab-rndis-modules
          path: output/
