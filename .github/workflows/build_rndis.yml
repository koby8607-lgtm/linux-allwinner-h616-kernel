name: Build RNDIS Kernel Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hexdump0815 Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev libncurses-dev git

      - name: Fetch Target Kernel Source
        run: |
          # Extract only the first HTTP/HTTPS URL from gitrepo
          REPO_URL=$(grep -o -m 1 'https://[^ ]*' gitrepo)
          echo "Cleaned URL: $REPO_URL"
          git clone --depth 1 --single-branch $REPO_URL kernel_source

      - name: Apply Config & Enable RNDIS Modules
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Copy hexdump0815's default 4.9.170 config
          cp ../config.616-4.9.170-bsp-616+ .config

          # Enable USB networking framework and RNDIS drivers
          scripts/config --module CONFIG_USB_USBNET
          scripts/config --module CONFIG_USB_NET_CDCETHER
          scripts/config --module CONFIG_USB_NET_RNDIS_HOST

          # Prepare kernel tree headers
          make olddefconfig
          make modules_prepare

      - name: Compile Network Drivers
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Compile network drivers with restricted threads to avoid runner limits
          make M=drivers/net/usb modules -j2

      - name: Collect & Package .ko Modules
        run: |
          mkdir output
          cp kernel_source/drivers/net/usb/usbnet.ko output/
          cp kernel_source/drivers/net/usb/cdc_ether.ko output/
          cp kernel_source/drivers/net/usb/rndis_host.ko output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h700-rndis-4.9.170-modules
          path: output/
