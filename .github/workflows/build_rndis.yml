name: Build RNDIS Kernel Modules (KNULLI Tree)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev libncurses-dev git

      - name: Fetch Official KNULLI Kernel Source
        run: |
          git clone --depth 1 https://github.com/knulli-cfw/knulli-linux.git kernel_source

      - name: Apply Config & Enable RNDIS Modules
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Load default H700 / Allwinner configuration
          make sun50iw9p1_defconfig

          # Force enable USB networking framework and RNDIS drivers
          scripts/config --module CONFIG_USB_USBNET
          scripts/config --module CONFIG_USB_NET_CDCETHER
          scripts/config --module CONFIG_USB_NET_RNDIS_HOST

          # Prepare kernel tree headers
          make olddefconfig
          make modules_prepare

      - name: Compile Network Drivers
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make M=drivers/net/usb modules -j2

      - name: Collect & Package .ko Modules
        run: |
          mkdir output
          cp kernel_source/drivers/net/usb/usbnet.ko output/
          cp kernel_source/drivers/net/usb/cdc_ether.ko output/
          cp kernel_source/drivers/net/usb/rndis_host.ko output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knulli-rndis-4.9.170-modules
          path: output/
