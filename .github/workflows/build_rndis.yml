name: Build RNDIS Kernel Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev libncurses-dev git

      - name: Fetch Allwinner H700/H616 Kernel Source
        run: |
          # Pull the actual Linux 4.9 kernel source tree used for H700
          git clone --depth 1 -b orange-pi-4.9-sun50iw9 https://github.com/orangepi-xunlong/linux-orangepi.git kernel_source

      - name: Configure & Enable Drivers
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Apply standard Allwinner sun50iw9 (H616/H700) configuration
          make sun50iw9p1_defconfig

          # Force enable USB networking framework and RNDIS drivers
          scripts/config --module CONFIG_USB_USBNET
          scripts/config --module CONFIG_USB_NET_CDCETHER
          scripts/config --module CONFIG_USB_NET_RNDIS_HOST

          # Prepare headers for standalone driver compilation
          make olddefconfig
          make modules_prepare

      - name: Compile Network Drivers
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make M=drivers/net/usb modules -j2

      - name: Collect & Package .ko Modules
        run: |
          mkdir output
          cp kernel_source/drivers/net/usb/usbnet.ko output/
          cp kernel_source/drivers/net/usb/cdc_ether.ko output/
          cp kernel_source/drivers/net/usb/rndis_host.ko output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knulli-rndis-4.9.170-modules
          path: output/
