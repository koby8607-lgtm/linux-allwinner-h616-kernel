name: Build RNDIS Kernel Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev libncurses-dev git

      - name: Fetch Allwinner H700 Kernel Source
        run: |
          git clone --depth 1 -b orange-pi-4.9-sun50iw9 https://github.com/orangepi-xunlong/linux-orangepi.git kernel_source

      - name: Configure & Enable Drivers
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Apply base H700 configuration
          CONFIG_PATH=$(find arch/ -name "*sun50i*" -o -name "*defconfig*" | head -n 1)
          cp "$CONFIG_PATH" .config

          # Prevent git localversion suffix (-g0cd0547ea)
          echo "" > .scmversion
          scripts/config --file .config --set-str CONFIG_LOCALVERSION ""
          scripts/config --file .config --disable CONFIG_LOCALVERSION_AUTO

          # REQUIRED: Enable ARM64 PLT relocation sections & symbol versioning
          scripts/config --file .config --enable CONFIG_ARM64_MODULE_PLTS
          scripts/config --file .config --enable CONFIG_MODVERSIONS

          # Force enable MII core dependency and USB networking framework
          scripts/config --file .config --module CONFIG_MII
          scripts/config --file .config --module CONFIG_USB_USBNET
          scripts/config --file .config --module CONFIG_USB_NET_CDCETHER
          scripts/config --file .config --module CONFIG_USB_NET_RNDIS_HOST

          make ARCH=arm64 olddefconfig
          make ARCH=arm64 modules_prepare

      - name: Compile Network Drivers
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=""

          # Build drivers/net subsystem
          make ARCH=arm64 M=drivers/net modules -j2

      - name: Collect & Package .ko Modules
        run: |
          mkdir output
          
          find kernel_source/drivers/net/ -name "mii.ko" -exec cp {} output/ \;
          cp kernel_source/drivers/net/usb/usbnet.ko output/
          cp kernel_source/drivers/net/usb/cdc_ether.ko output/
          cp kernel_source/drivers/net/usb/rndis_host.ko output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knulli-rndis-4.9.170-modules
          path: output/
