- name: Configure & Enable Drivers
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Find and apply base configuration
          CONFIG_PATH=$(find arch/ -name "*sun50i*" -o -name "*defconfig*" | head -n 1)
          cp "$CONFIG_PATH" .config

          # Force enable MII core dependency alongside USB networking framework
          scripts/config --module CONFIG_MII
          scripts/config --module CONFIG_USB_USBNET
          scripts/config --module CONFIG_USB_NET_CDCETHER
          scripts/config --module CONFIG_USB_NET_RNDIS_HOST

          make olddefconfig
          make modules_prepare

      - name: Compile Network Drivers
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Build both net core drivers and usb drivers
          make M=drivers/net modules -j2

      - name: Collect & Package .ko Modules
        run: |
          mkdir output
          # Copy mii.ko if built as a module, along with usbnet stack
          find kernel_source/drivers/net/ -name "mii.ko" -exec cp {} output/ \;
          cp kernel_source/drivers/net/usb/usbnet.ko output/
          cp kernel_source/drivers/net/usb/cdc_ether.ko output/
          cp kernel_source/drivers/net/usb/rndis_host.ko output/
