name: Build RNDIS Kernel Modules (KNULLI Tree)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev libncurses-dev git

      - name: Fetch Official KNULLI Kernel Source
        run: |
          git clone --depth 1 https://github.com/knulli-cfw/knulli-linux.git kernel_source

      - name: Locate & Apply Target Defconfig
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # 1. Search for any defconfig file across the entire kernel source tree
          CONF_FILE=$(find . -type f \( -name "*defconfig*" -o -name "*.config" \) | grep -v "/\.git/" | head -n 1)

          if [ -n "$CONF_FILE" ]; then
            echo "Found configuration file at: $CONF_FILE"
            cp "$CONF_FILE" .config
            make ARCH=arm64 olddefconfig
          else
            echo "No config file found. Attempting generic ARCH=arm64 defconfig..."
            make ARCH=arm64 defconfig || make ARCH=arm64 linux_defconfig
          fi

          # 2. Force enable USB networking framework and RNDIS drivers
          scripts/config --module CONFIG_USB_USBNET
          scripts/config --module CONFIG_USB_NET_CDCETHER
          scripts/config --module CONFIG_USB_NET_RNDIS_HOST

          # 3. Prepare kernel headers for standalone driver compilation
          make ARCH=arm64 olddefconfig
          make ARCH=arm64 modules_prepare

      - name: Compile Network Drivers
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make ARCH=arm64 M=drivers/net/usb modules -j2

      - name: Collect & Package .ko Modules
        run: |
          mkdir output
          cp kernel_source/drivers/net/usb/usbnet.ko output/
          cp kernel_source/drivers/net/usb/cdc_ether.ko output/
          cp kernel_source/drivers/net/usb/rndis_host.ko output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knulli-rndis-4.9.170-modules
          path: output/
