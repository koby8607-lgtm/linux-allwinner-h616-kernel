name: Build KNULLI RG28XX with RNDIS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git libncurses-dev libssl-dev mercurial \
            texinfo zip pigz xdelta3 default-jre imagemagick subversion \
            autoconf automake bison scons libglib2.0-dev bc mtools \
            u-boot-tools flex wget cpio dosfstools libtool rsync \
            device-tree-compiler gettext locales graphviz python3 \
            gcc-multilib g++-multilib

      - name: Checkout KNULLI
        run: |
          git clone --depth=1 --recurse-submodules \
            https://github.com/knulli-cfw/distribution.git knulli
          cd knulli
          git submodule update --init --recursive

      - name: Install RG28XX RNDIS board definition
        working-directory: knulli
        run: |
          cat > configs/knulli-h700-rg28xx-rndis.board <<'EOF'
          include knulli-board.common
          BR2_aarch64=y
          BR2_cortex_a53=y
          BR2_ARM_FPU_NEON_FP_ARMV8=y
          BR2_PACKAGE_BATOCERA_TARGET_H700=y
          BR2_TARGET_OPTIMIZATION="-pipe -fsigned-char -mcpu=cortex-a53 -mtune=cortex-a53"
          BR2_TARGET_GENERIC_GETTY_BAUDRATE_115200=y
          BR2_GLOBAL_PATCH_DIR="$(BR2_EXTERNAL_KNULLI_PATH)/board/patches $(BR2_EXTERNAL_KNULLI_PATH)/board/allwinner/patches $(BR2_EXTERNAL_KNULLI_PATH)/board/allwinner/h700/patches"
          BR2_ROOTFS_OVERLAY="$(BR2_EXTERNAL_KNULLI_PATH)/board/fsoverlay $(BR2_EXTERNAL_KNULLI_PATH)/board/allwinner/h700/fsoverlay"
          BR2_TARGET_ROOTFS_SQUASHFS4_GZIP=y
          BR2_PACKAGE_BATOCERA_SPLASH_MPV=y
          BR2_PACKAGE_BATOCERA_KODI20=n
          BR2_PACKAGE_MPV=y
          BR2_LINUX_KERNEL=y
          BR2_LINUX_KERNEL_CUSTOM_GIT=y
          BR2_LINUX_KERNEL_CUSTOM_REPO_URL="https://github.com/orangepi-xunlong/linux-orangepi.git"
          BR2_LINUX_KERNEL_CUSTOM_REPO_VERSION="orange-pi-4.9-sun50iw9"
          BR2_LINUX_KERNEL_USE_CUSTOM_CONFIG=y
          BR2_LINUX_KERNEL_CUSTOM_CONFIG_FILE="$(BR2_EXTERNAL_KNULLI_PATH)/board/allwinner/h700/linux-sunxi64-legacy.config"
          BR2_PACKAGE_HOST_LINUX_HEADERS_CUSTOM_4_9=y
          BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="4.9.170"
          BR2_LINUX_KERNEL_VERSION="4.9.170"
          BR2_KERNEL_HEADERS_VERSION=y
          BR2_DEFAULT_KERNEL_VERSION="4.9.170"
          BR2_PACKAGE_HOST_LINUX_HEADERS_CUSTOM_4_9=y
          BR2_DEFAULT_KERNEL_HEADERS="4.9.170"
          BR2_TOOLCHAIN_HEADERS_AT_LEAST="4.9"
          BR2_PACKAGE_UBOOT_H700=y
          BR2_PACKAGE_HOST_DOSFSTOOLS=y
          BR2_PACKAGE_HOST_GENIMAGE=y
          BR2_PACKAGE_HOST_MTOOLS=y
          BR2_PACKAGE_HOST_UBOOT_TOOLS=y
          BR2_TARGET_ROOTFS_EXT2_3=y
          BR2_TARGET_ROOTFS_EXT2_GEN=3
          BR2_TARGET_ROOTFS_EXT2_REV=1
          BR2_TARGET_ROOTFS_EXT2_LABEL="rootfs"
          BR2_TARGET_ROOTFS_EXT2_SIZE="3300M"
          BR2_TARGET_ROOTFS_EXT2_INODES=0
          BR2_TARGET_ROOTFS_EXT2_RESBLKS=5
          BR2_TARGET_ROOTFS_EXT2_MKFS_OPTIONS="-O ^64bit"
          BR2_TARGET_ROOTFS_EXT2_NONE=y
          BR2_PACKAGE_HAS_LIBMALI=y
          BR2_PACKAGE_PROVIDES_LIBMALI="mali-g31-fbdev"
          BR2_PACKAGE_MALI_G31_FBDEV=y
          BR2_PACKAGE_UTIL_LINUX_MOUNT=y
          BR2_PACKAGE_ANDROID_TOOLS=y
          BR2_PACKAGE_ANDROID_TOOLS_ADBD=y
          BR2_PACKAGE_SDL=y
          BR2_PACKAGE_SDL_FBCON=y
          BR2_PACKAGE_SDL_GFX=y
          BR2_PACKAGE_SDL_IMAGE=y
          BR2_PACKAGE_SDL_IMAGE_BMP=y
          BR2_PACKAGE_SDL_IMAGE_JPEG=y
          BR2_PACKAGE_SDL_IMAGE_PNG=y
          BR2_PACKAGE_SDL_SOUND=y
          BR2_PACKAGE_SDL_TTF=y
          BR2_PACKAGE_SDL12_COMPAT=y
          BR2_PACKAGE_GPTFDISK=y
          BR2_PACKAGE_GPTFDISK_GDISK=y
          BR2_PACKAGE_GPTFDISK_SGDISK=y
          BR2_PACKAGE_PYTHON3_XZ=y
          BR2_PACKAGE_DHCPD=y
          BR2_PACKAGE_M8C=y
          EOF

      - name: Add RNDIS kernel configuration
        working-directory: knulli
        run: |
          mkdir -p board/allwinner/h700/rndis
          cat > board/allwinner/h700/rndis/rndis.config <<'EOF'
          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_NET_RNDIS_HOST=m
          EOF

      - name: Add RNDIS config fragment to board
        working-directory: knulli
        run: |
          cat >> configs/knulli-h700-rg28xx-rndis.board <<'EOF'
          BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES="$(BR2_EXTERNAL_KNULLI_PATH)/board/allwinner/h700/rndis/rndis.config"
          EOF

      - name: Add Unisoc 1782:000c RNDIS quirk
        working-directory: knulli
        run: |
          mkdir -p board/allwinner/h700/patches/linux

          git clone --depth=1 --branch orange-pi-4.9-sun50iw9 \
            https://github.com/orangepi-xunlong/linux-orangepi.git /tmp/orange-pi-kernel

          cd /tmp/orange-pi-kernel
          git fetch --unshallow >/dev/null 2>&1 || true

          python3 - <<'PY'
          from pathlib import Path

          p = Path("drivers/net/usb/cdc_ether.c")
          s = p.read_text()

          # The exact Orange Pi 4.9.170 BSP already contains its Android
          # RNDIS descriptor workaround. Do not try to rediscover/reinject
          # that code using fragile text matching.
          if "android_rndis_quirk" not in s:
              raise SystemExit(
                  "Expected Orange Pi Android RNDIS workaround is missing; "
                  "refusing to apply an unverified patch."
              )

          # Add a device-specific quirk only to the existing bind path.
          marker = "bool android_rndis_quirk = false;"
          if "unisoc_1782_000c_quirk" not in s:
              replacement = """bool android_rndis_quirk = false;
              bool unisoc_1782_000c_quirk = false;"""
              if marker not in s:
                  raise SystemExit("Could not locate the known BSP RNDIS quirk declaration")
              s = s.replace(marker, replacement, 1)

              old = """if (rndis && (!info->u || android_rndis_quirk)) {
                  info->u = &rndis_union_desc;
                  info->control = intf;
                  info->data = usb_ifnum_to_if(udev, 1);
              }"""
              new = """if (rndis && (!info->u || android_rndis_quirk ||
                             unisoc_1782_000c_quirk)) {
                  info->u = &rndis_union_desc;
                  info->control = intf;
                  info->data = usb_ifnum_to_if(udev, 1);
              }"""

              # Set the device-specific flag immediately before the existing
              # generic Android workaround logic.
              needle = "if (rndis && !info->u) {"
              if needle not in s:
                  raise SystemExit("Could not locate the existing RNDIS bind path")

              s = s.replace(
                  needle,
                  """unisoc_1782_000c_quirk =
                      (le16_to_cpu(udev->descriptor.idVendor) == 0x1782 &&
                       le16_to_cpu(udev->descriptor.idProduct) == 0x000c);

              """ + needle,
                  1
              )

              if old not in s:
                  raise SystemExit(
                      "Could not locate the exact Orange Pi RNDIS interface fallback; "
                      "source layout differs from the verified BSP."
                  )
              s = s.replace(old, new, 1)

              p.write_text(s)

          PY

          cd /tmp/orange-pi-kernel
          git diff -- drivers/net/usb/cdc_ether.c > /tmp/unisoc-rndis.patch

          test -s /tmp/unisoc-rndis.patch
          cp /tmp/unisoc-rndis.patch \
            "$GITHUB_WORKSPACE/knulli/board/allwinner/h700/patches/linux/0001-rg28xx-unisoc-1782-000c-rndis.patch"

      - name: Verify generated patch
        working-directory: knulli
        run: |
          test -s board/allwinner/h700/patches/linux/0001-rg28xx-unisoc-1782-000c-rndis.patch
          grep -q '1782' board/allwinner/h700/patches/linux/0001-rg28xx-unisoc-1782-000c-rndis.patch
          grep -q '000c' board/allwinner/h700/patches/linux/0001-rg28xx-unisoc-1782-000c-rndis.patch
          grep -q 'unisoc_1782_000c_quirk' board/allwinner/h700/patches/linux/0001-rg28xx-unisoc-1782-000c-rndis.patch

      - name: Generate Buildroot defconfig
        working-directory: knulli
        run: |
          ./configs/createDefconfig.sh ./configs/knulli-h700-rg28xx-rndis
          test -f configs/knulli-h700-rg28xx-rndis_defconfig
          grep -q 'BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES' \
            configs/knulli-h700-rg28xx-rndis_defconfig

      - name: Build complete KNULLI image
        working-directory: knulli
        env:
          MAKE_JLEVEL: 4
        run: |
          make DIRECT_BUILD=1 MAKE_JLEVEL=4 \
            h700-rg28xx-rndis-build

      - name: Verify kernel RNDIS support
        working-directory: knulli
        run: |
          CONFIG="$(find output/h700-rg28xx-rndis -name .config -path '*/linux-*/*' | head -1)"
          if [ -z "$CONFIG" ]; then
            CONFIG="output/h700-rg28xx-rndis/build/linux-*/.config"
          fi

          echo "Kernel config:"
          grep -E '^CONFIG_USB_USBNET=|^CONFIG_USB_NET_CDCETHER=|^CONFIG_USB_NET_RNDIS_HOST=' \
            output/h700-rg28xx-rndis/build/linux-*/.config

          grep -q '^CONFIG_USB_USBNET=y$' \
            output/h700-rg28xx-rndis/build/linux-*/.config
          grep -q '^CONFIG_USB_NET_CDCETHER=y$' \
            output/h700-rg28xx-rndis/build/linux-*/.config
          grep -q '^CONFIG_USB_NET_RNDIS_HOST=m$' \
            output/h700-rg28xx-rndis/build/linux-*/.config

          find output/h700-rg28xx-rndis -name 'rndis_host.ko' -print

      - name: Locate final image
        id: image
        working-directory: knulli
        run: |
          IMG="$(find output/h700-rg28xx-rndis/images -type f \
            \( -name '*.img.gz' -o -name '*.img' \) | head -1)"

          if [ -z "$IMG" ]; then
            echo "No final KNULLI image found"
            find output/h700-rg28xx-rndis/images -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "Built image: $IMG"

      - name: Package build metadata
        working-directory: knulli
        run: |
          {
            echo "KNULLI RG28XX RNDIS build"
            echo
            echo "Kernel: Linux 4.9.170"
            echo "Target: Allwinner H700 / RG28XX"
            echo "RNDIS: CONFIG_USB_NET_RNDIS_HOST=m"
            echo "usbnet: CONFIG_USB_USBNET=y"
            echo "cdc_ether: CONFIG_USB_NET_CDCETHER=y"
            echo "USB device quirk: Unisoc 1782:000c"
            echo
            echo "This image is built using the KNULLI Buildroot/genimage pipeline."
          } > rndis-build-info.txt

      - name: Upload complete image
        uses: actions/upload-artifact@v4
        with:
          name: knulli-h700-rg28xx-rndis
          path: |
            knulli/${{ steps.image.outputs.image }}
            knulli/rndis-build-info.txt
          if-no-files-found: error
          retention-days: 14
