name: Build KNULLI H700 RNDIS Host Module

on:
  workflow_dispatch:

jobs:
  build:
    name: Build rndis_host.ko
    runs-on: ubuntu-22.04

    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            device-tree-compiler \
            flex \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            wget \
            xz-utils \
            zip

      # ------------------------------------------------------------
      # KNULLI's documented H700 module-build method uses:
      #   Linux 4.9.170
      #   KNULLI H700 config
      #
      # The KNULLI repo itself is a Buildroot external tree and does
      # not contain the vendor Linux source.
      # ------------------------------------------------------------

      - name: Download Linux 4.9.170
        run: |
          set -eux

          wget -O linux-4.9.170.tar.gz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.170.tar.gz

          tar -xzf linux-4.9.170.tar.gz

      - name: Download KNULLI H700 kernel configuration
        working-directory: linux-4.9.170
        run: |
          set -eux

          wget -O .config \
            https://raw.githubusercontent.com/knulli-cfw/distribution/refs/heads/knulli-main/board/batocera/allwinner/h700/linux-sunxi64-legacy.config

          echo "Relevant KNULLI configuration:"
          grep -E \
            '^(CONFIG_MODULES|CONFIG_MODULE_FORCE_LOAD|CONFIG_MODULE_UNLOAD|CONFIG_MODVERSIONS|CONFIG_MODULE_SRCVERSION_ALL|CONFIG_USB_USBNET|CONFIG_USB_NET_CDCETHER|CONFIG_USB_NET_RNDIS_HOST)=' \
            .config || true

      - name: Enable RNDIS host module
        working-directory: linux-4.9.170
        run: |
          set -eux

          # RNDIS host must be a loadable module.
          if grep -q '^# CONFIG_USB_NET_RNDIS_HOST is not set$' .config; then
            sed -i \
              's/^# CONFIG_USB_NET_RNDIS_HOST is not set$/CONFIG_USB_NET_RNDIS_HOST=m/' \
              .config
          elif grep -q '^CONFIG_USB_NET_RNDIS_HOST=' .config; then
            sed -i \
              's/^CONFIG_USB_NET_RNDIS_HOST=.*/CONFIG_USB_NET_RNDIS_HOST=m/' \
              .config
          else
            echo 'CONFIG_USB_NET_RNDIS_HOST=m' >> .config
          fi

          # These are already built into your KNULLI kernel, and the
          # KNULLI config should keep them as built-ins.
          grep -q '^CONFIG_USB_USBNET=y$' .config
          grep -q '^CONFIG_USB_NET_CDCETHER=y$' .config

          echo
          echo "RNDIS configuration:"
          grep -E \
            '^(CONFIG_USB_USBNET|CONFIG_USB_NET_CDCETHER|CONFIG_USB_NET_RNDIS_HOST|CONFIG_MODULES|CONFIG_MODVERSIONS)=' \
            .config

      - name: Fix Linux 4.9 DTC source
        working-directory: linux-4.9.170
        run: |
          set -eux

          # Required by the old 4.9.170 DTC shipped in the source tree.
          if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
            sed -i \
              's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/g' \
              scripts/dtc/dtc-lexer.lex.c_shipped
          fi

      # ------------------------------------------------------------
      # Use the KNULLI RG35XX Plus/H/2024 SDK.
      #
      # This is the KNULLI-published toolchain used by their
      # community H700 module build procedure.
      # ------------------------------------------------------------

      - name: Download KNULLI H700 toolchain
        run: |
          set -eux

          wget -O knulli-sdk.tar.gz \
            https://github.com/knulli-cfw/toolchains/releases/download/rg35xx-plush-sdk-20240421/aarch64-buildroot-linux-gnu_sdk-buildroot.tar.gz

          tar -xzf knulli-sdk.tar.gz

          ./aarch64-buildroot-linux-gnu_sdk-buildroot/relocate-sdk.sh

      - name: Configure cross compiler
        run: |
          set -eux

          SDK="$GITHUB_WORKSPACE/aarch64-buildroot-linux-gnu_sdk-buildroot"

          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin" >> "$GITHUB_PATH"

          echo "CROSS_COMPILE=$SDK/bin/aarch64-buildroot-linux-gnu-" >> "$GITHUB_ENV"

          "$SDK/bin/aarch64-buildroot-linux-gnu-gcc" --version

      # ------------------------------------------------------------
      # Generate the kernel's symbol/version information.
      #
      # IMPORTANT:
      # modules_prepare alone is insufficient when CONFIG_MODVERSIONS
      # is enabled. We therefore build the kernel far enough for
      # Module.symvers to be generated.
      # ------------------------------------------------------------

      - name: Prepare kernel
        working-directory: linux-4.9.170
        run: |
          set -eux

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

          echo
          echo "Final kernel configuration:"
          grep -E \
            '^(CONFIG_MODULES|CONFIG_MODULE_FORCE_LOAD|CONFIG_MODULE_UNLOAD|CONFIG_MODVERSIONS|CONFIG_MODULE_SRCVERSION_ALL|CONFIG_USB_USBNET|CONFIG_USB_NET_CDCETHER|CONFIG_USB_NET_RNDIS_HOST)=' \
            .config

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            modules_prepare

      - name: Build kernel symbol/version table
        working-directory: linux-4.9.170
        run: |
          set -eux

          # vmlinux causes the kernel objects to be built and lets
          # modpost generate Module.symvers for CONFIG_MODVERSIONS.
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            vmlinux

          test -f Module.symvers

          echo
          echo "Module.symvers:"
          ls -lh Module.symvers

          echo
          echo "module_layout from Module.symvers:"
          grep -w 'module_layout' Module.symvers

      # ------------------------------------------------------------
      # Build only drivers/net/usb.
      # ------------------------------------------------------------

      - name: Build USB networking drivers
        working-directory: linux-4.9.170
        run: |
          set -eux

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            M=drivers/net/usb \
            modules

          test -f drivers/net/usb/rndis_host.ko

      # ------------------------------------------------------------
      # Inspect the result.
      # ------------------------------------------------------------

      - name: Inspect rndis_host.ko
        working-directory: linux-4.9.170
        run: |
          set -eux

          echo "========================================"
          echo "rndis_host.ko"
          echo "========================================"

          file drivers/net/usb/rndis_host.ko

          echo
          echo "modinfo:"
          modinfo drivers/net/usb/rndis_host.ko

          echo
          echo "vermagic:"
          modinfo drivers/net/usb/rndis_host.ko |
            grep '^vermagic:'

          echo
          echo "module_layout in Module.symvers:"
          grep -w 'module_layout' Module.symvers

      # ------------------------------------------------------------
      # Compare against the CRC extracted from the actual working
      # KNULLI 8812au.ko on the RG28XX.
      # ------------------------------------------------------------

      - name: Verify KNULLI module_layout CRC
        working-directory: linux-4.9.170
        run: |
          set -eux

          EXPECTED="0x3491861c"

          ACTUAL="$(
            awk '$2 == "module_layout" {print $1}' Module.symvers
          )"

          echo "Expected KNULLI CRC : $EXPECTED"
          echo "Generated CRC       : $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo
            echo "ERROR: module_layout CRC does NOT match the running KNULLI kernel."
            echo
            echo "This .ko must NOT be installed on the RG28XX."
            echo
            echo "The public KNULLI source/config does not reproduce the"
            echo "stock/vendor kernel CRC. KNULLI's wiki documents that"
            echo "released H700 firmware uses the stock kernel binary."
            exit 1
          fi

          echo
          echo "SUCCESS: module_layout CRC matches KNULLI."

      - name: Verify module CRC record
        working-directory: linux-4.9.170
        run: |
          set -eux

          python3 <<'PY'
          import struct

          path = "drivers/net/usb/rndis_host.ko"

          data = open(path, "rb").read()

          needle = b"module_layout"
          offsets = []

          pos = 0
          while True:
              pos = data.find(needle, pos)
              if pos < 0:
                  break
              offsets.append(pos)
              pos += 1

          print("module_layout occurrences:", offsets)

          found = False

          for off in offsets:
              if off < 8:
                  continue

              crc = struct.unpack_from("<I", data, off - 8)[0]
              padding = struct.unpack_from("<I", data, off - 4)[0]

              print(
                  "offset=%d crc=0x%08x padding=0x%08x"
                  % (off, crc, padding)
              )

              if padding == 0:
                  if crc == 0x3491861c:
                      found = True

          if not found:
              raise SystemExit(
                  "ERROR: rndis_host.ko does not contain "
                  "module_layout CRC 0x3491861c"
              )

          print("SUCCESS: rndis_host.ko contains the expected CRC.")
          PY

      # ------------------------------------------------------------
      # Package only after all checks pass.
      # ------------------------------------------------------------

      - name: Create artifact
        run: |
          set -eux

          mkdir -p artifact

          cp \
            linux-4.9.170/drivers/net/usb/rndis_host.ko \
            artifact/rndis_host.ko

          sha256sum artifact/rndis_host.ko \
            > artifact/SHA256SUMS

          cat > artifact/README.txt <<'EOF'
          KNULLI RG28XX RNDIS host module

          Target:
            Anbernic RG28XX
            KNULLI SCARAB
            Linux 4.9.170
            ARM64

          This module was built against:
            Linux 4.9.170
            KNULLI H700 configuration
            KNULLI H700 AArch64 toolchain

          The build was accepted only when:
            module_layout CRC = 0x3491861c

          Install:
            cp rndis_host.ko /lib/modules/4.9.170/extra/
            depmod -a
            modprobe rndis_host

          Do not install if the GitHub Actions build did not pass
          the module_layout CRC verification.
          EOF

          zip -9 \
            artifact/rndis_host-knulli-rg28xx.zip \
            artifact/rndis_host.ko \
            artifact/SHA256SUMS \
            artifact/README.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rndis-host-knulli-rg28xx
          path: |
            artifact/rndis_host.ko
            artifact/SHA256SUMS
            artifact/README.txt
            artifact/rndis_host-knulli-rg28xx.zip
          if-no-files-found: error
