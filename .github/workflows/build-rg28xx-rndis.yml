```yaml
name: Build KNULLI H700 RNDIS Host Module

on:
  workflow_dispatch:

jobs:
  build-rndis:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            cpio \
            rsync \
            unzip \
            wget \
            xz-utils \
            device-tree-compiler

      - name: Checkout KNULLI Linux tree
        run: |
          git clone --depth=1 \
            --branch knulli-main \
            https://github.com/knulli-cfw/knulli-linux.git \
            knulli-linux

      - name: Show KNULLI revision
        working-directory: knulli-linux
        run: |
          echo "KNULLI commit:"
          git rev-parse HEAD
          echo
          echo "Kernel configuration:"
          ls -l board/allwinner/h700/

      - name: Locate Linux 4.9.170 source
        working-directory: knulli-linux
        run: |
          echo "Searching for Linux kernel source/configuration..."

          find . \
            \( -name 'linux-4.9.170*' \
            -o -name 'linux-sunxi64-legacy.config' \
            -o -name 'linux.mk' \) \
            -print

      - name: Prepare KNULLI H700 kernel configuration
        working-directory: knulli-linux
        run: |
          CONFIG="board/allwinner/h700/linux-sunxi64-legacy.config"

          test -f "$CONFIG"

          echo "Using:"
          echo "$CONFIG"

          mkdir -p build-kernel
          cp "$CONFIG" build-kernel/.config

          echo
          echo "Original RNDIS setting:"
          grep -E \
            'CONFIG_USB_USBNET|CONFIG_USB_NET_CDCETHER|CONFIG_USB_NET_RNDIS_HOST|CONFIG_MODVERSIONS|CONFIG_MODULES' \
            build-kernel/.config || true

          echo
          echo "Enabling RNDIS host module..."

          sed -i \
            's/^# CONFIG_USB_NET_RNDIS_HOST is not set$/CONFIG_USB_NET_RNDIS_HOST=m/' \
            build-kernel/.config

          if ! grep -q '^CONFIG_USB_NET_RNDIS_HOST=m$' build-kernel/.config; then
            echo 'CONFIG_USB_NET_RNDIS_HOST=m' >> build-kernel/.config
          fi

          echo
          echo "Final relevant configuration:"
          grep -E \
            'CONFIG_USB_USBNET|CONFIG_USB_NET_CDCETHER|CONFIG_USB_NET_RNDIS_HOST|CONFIG_MODVERSIONS|CONFIG_MODULES' \
            build-kernel/.config

      - name: Find kernel source
        working-directory: knulli-linux
        run: |
          set -eux

          echo "Searching repository for Linux source directories..."

          find . -maxdepth 5 -type d \
            \( -name 'linux' -o -name 'linux-*' \) \
            -print | head -100

          echo
          echo "Searching Buildroot Linux package definitions..."

          find . -type f \
            \( -name '*.mk' -o -name '*.in' \) \
            -print0 |
            xargs -0 grep -nH 'linux-sunxi64\|4.9.170\|LINUX_VERSION' \
            2>/dev/null | head -200

      - name: Build KNULLI kernel / Module.symvers
        working-directory: knulli-linux
        run: |
          set -eux

          # Find the kernel source that KNULLI provides.
          KERNEL_DIR="$(find . -type f -name 'Makefile' \
            -exec sh -c '
              for f do
                if grep -q "VERSION = 4" "$f" 2>/dev/null &&
                   grep -q "PATCHLEVEL = 9" "$f" 2>/dev/null; then
                  dirname "$f"
                  exit 0
                fi
              done
            ' sh {} + | head -1)"

          if [ -z "$KERNEL_DIR" ]; then
            echo "ERROR: Could not locate Linux 4.9 kernel source in repository."
            echo
            echo "Repository tree:"
            find . -maxdepth 4 -type f -name Makefile | head -100
            exit 1
          fi

          echo "Kernel source: $KERNEL_DIR"

          cd "$KERNEL_DIR"

          # Use the KNULLI H700 configuration.
          cp ../../../../board/allwinner/h700/linux-sunxi64-legacy.config .config 2>/dev/null || true

          # If the relative path above does not match the source layout,
          # locate the config explicitly.
          if [ ! -f .config ]; then
            KNULLI_CONFIG="$(cd ../.. && find . -path '*/board/allwinner/h700/linux-sunxi64-legacy.config' -print -quit)"
            if [ -n "$KNULLI_CONFIG" ]; then
              cp "$KNULLI_CONFIG" .config
            fi
          fi

          test -f .config

          # Enable the RNDIS host driver as a module.
          if grep -q '^# CONFIG_USB_NET_RNDIS_HOST is not set$' .config; then
            sed -i \
              's/^# CONFIG_USB_NET_RNDIS_HOST is not set$/CONFIG_USB_NET_RNDIS_HOST=m/' \
              .config
          elif ! grep -q '^CONFIG_USB_NET_RNDIS_HOST=m$' .config; then
            echo 'CONFIG_USB_NET_RNDIS_HOST=m' >> .config
          fi

          # Ensure the dependencies expected by rndis_host are enabled.
          sed -i \
            's/^# CONFIG_USB_USBNET is not set$/CONFIG_USB_USBNET=y/' \
            .config

          sed -i \
            's/^# CONFIG_USB_NET_CDCETHER is not set$/CONFIG_USB_NET_CDCETHER=y/' \
            .config

          echo
          echo "Kernel configuration:"
          grep -E \
            'CONFIG_USB_USBNET|CONFIG_USB_NET_CDCETHER|CONFIG_USB_NET_RNDIS_HOST|CONFIG_MODULES|CONFIG_MODVERSIONS' \
            .config

          echo
          echo "Preparing kernel..."
          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "Running modules_prepare..."
          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            modules_prepare

          echo
          echo "Building kernel enough to generate Module.symvers..."
          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

          test -f Module.symvers

          echo
          echo "Module.symvers generated:"
          ls -lh Module.symvers

          echo
          echo "Checking module_layout:"
          grep -w 'module_layout' Module.symvers || true

      - name: Build rndis_host.ko
        working-directory: knulli-linux
        run: |
          set -eux

          KERNEL_DIR="$(find . -type f -name 'Module.symvers' \
            -exec sh -c '
              for f do
                if grep -q "module_layout" "$f" 2>/dev/null; then
                  dirname "$f"
                  exit 0
                fi
              done
            ' sh {} + | head -1)"

          if [ -z "$KERNEL_DIR" ]; then
            echo "ERROR: Could not find generated kernel tree."
            find . -name Module.symvers -print
            exit 1
          fi

          echo "Kernel tree:"
          echo "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo
          echo "Building RNDIS host module..."

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/net/usb \
            modules

          echo
          echo "Searching for rndis_host.ko..."
          find . -name 'rndis_host.ko' -print

          RNDIS="$(find . -name 'rndis_host.ko' -print -quit)"

          test -n "$RNDIS"
          test -f "$RNDIS"

          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$RNDIS" "$GITHUB_WORKSPACE/artifact/rndis_host.ko"

      - name: Verify module
        working-directory: knulli-linux
        run: |
          set -eux

          MOD="$GITHUB_WORKSPACE/artifact/rndis_host.ko"

          echo "========================================"
          echo " RNDIS MODULE"
          echo "========================================"

          file "$MOD"

          echo
          echo "modinfo:"
          modinfo "$MOD" || true

          echo
          echo "vermagic:"
          modinfo "$MOD" | grep '^vermagic:' || true

          echo
          echo "module_layout CRC in generated Module.symvers:"
          grep -w 'module_layout' \
            "$(find . -name Module.symvers -print -quit)" || true

          echo
          echo "module_layout in module:"
          grep -aob 'module_layout' "$MOD" || true

          echo
          echo "========================================"

      - name: Compare expected KNULLI CRC
        working-directory: knulli-linux
        run: |
          set -eux

          SYMVERS="$(find . -name Module.symvers -print -quit)"
          MOD="$GITHUB_WORKSPACE/artifact/rndis_host.ko"

          echo "KNULLI Module.symvers:"
          grep -w 'module_layout' "$SYMVERS" || true

          echo
          echo "Built module:"
          modinfo "$MOD" | grep '^vermagic:' || true

          echo
          echo "Expected target CRC from known-good RG28XX:"
          echo "0x3491861c"

          echo
          echo "NOTE:"
          echo "The GitHub build is considered an exact match only if"
          echo "the generated module_layout CRC is 0x3491861c."

      - name: Package artifact
        run: |
          cd artifact

          sha256sum rndis_host.ko > SHA256SUMS

          cat > README.txt <<'EOF'
          KNULLI H700 RNDIS host module

          Target:
            Anbernic RG28XX
            KNULLI
            Linux 4.9.170
            ARM64

          Expected known-good KNULLI module_layout CRC:
            0x3491861c

          Before installing, verify:
            modinfo rndis_host.ko

          The vermagic should be:
            4.9.170 SMP preempt mod_unload modversions aarch64
          EOF

          zip -9 rndis_host-knulli-h700.zip \
            rndis_host.ko \
            SHA256SUMS \
            README.txt

      - name: Upload RNDIS module
        uses: actions/upload-artifact@v4
        with:
          name: rndis-host-knulli-h700
          path: |
            artifact/rndis_host.ko
            artifact/SHA256SUMS
            artifact/README.txt
            artifact/rndis_host-knulli-h700.zip
          if-no-files-found: error
```
